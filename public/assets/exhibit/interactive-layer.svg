<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Interactive layer diagram</title>
  <desc id="desc">A simplified exhibit diagram showing labels, timeline, sources, voice, and commentary modules.</desc>
  <rect width="1200" height="900" fill="#ece2d2"/>
  <rect x="44" y="44" width="1112" height="812" rx="30" fill="#f7f1e7" stroke="#2b211a" stroke-opacity="0.18"/>
  <text x="88" y="112" fill="#6d2d1d" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="4">INTERACTIVE LAYER</text>
  <rect x="88" y="170" width="476" height="236" rx="24" fill="#fffaf1" stroke="#2b211a" stroke-opacity="0.14"/>
  <text x="128" y="250" fill="#17120e" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">LABELS</text>
  <text x="128" y="316" fill="#5d4d3e" font-family="Arial, Helvetica, sans-serif" font-size="30">maker</text>
  <text x="276" y="316" fill="#5d4d3e" font-family="Arial, Helvetica, sans-serif" font-size="30">date</text>
  <text x="388" y="316" fill="#5d4d3e" font-family="Arial, Helvetica, sans-serif" font-size="30">provenance</text>
  <rect x="608" y="170" width="504" height="236" rx="24" fill="#fffaf1" stroke="#2b211a" stroke-opacity="0.14"/>
  <text x="650" y="250" fill="#17120e" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">TIMELINE</text>
  <path d="M652 324H1060" stroke="#a84b2f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="722" cy="324" r="16" fill="#17120e"/>
  <circle cx="856" cy="324" r="16" fill="#17120e"/>
  <circle cx="990" cy="324" r="16" fill="#17120e"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34">
    <rect x="88" y="470" width="304" height="214" rx="24" fill="#fffaf1" stroke="#2b211a" stroke-opacity="0.14"/>
    <rect x="448" y="470" width="304" height="214" rx="24" fill="#fffaf1" stroke="#2b211a" stroke-opacity="0.14"/>
    <rect x="808" y="470" width="304" height="214" rx="24" fill="#fffaf1" stroke="#2b211a" stroke-opacity="0.14"/>
    <text x="156" y="588" fill="#17120e">SOURCES</text>
    <text x="510" y="588" fill="#17120e">VOICE</text>
    <text x="858" y="588" fill="#17120e">COMMENTARY</text>
  </g>
</svg>