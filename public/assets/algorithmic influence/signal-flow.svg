<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal flow diagram</title>
  <desc id="desc">A simplified four-step diagram for algorithmic input, filtering, ranking, and output.</desc>
  <rect width="1200" height="760" fill="#f1fbf7"/>
  <rect x="44" y="44" width="1112" height="672" rx="28" fill="#f8fcfb" stroke="#0e1d17" stroke-opacity="0.12"/>
  <text x="88" y="108" fill="#007a58" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="4">SIGNAL FLOW</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="88" y="274" width="220" height="148" rx="24" fill="#ffffff" stroke="#0e1d17" stroke-opacity="0.14"/>
    <text x="148" y="360" fill="#0e1d17" font-size="38">INPUT</text>
    <rect x="362" y="274" width="220" height="148" rx="24" fill="#ffffff" stroke="#0e1d17" stroke-opacity="0.14"/>
    <text x="410" y="360" fill="#0e1d17" font-size="38">FILTER</text>
    <rect x="636" y="274" width="220" height="148" rx="24" fill="#ffffff" stroke="#0e1d17" stroke-opacity="0.14"/>
    <text x="698" y="360" fill="#0e1d17" font-size="38">RANK</text>
    <rect x="910" y="274" width="180" height="148" rx="24" fill="#ffffff" stroke="#0e1d17" stroke-opacity="0.14"/>
    <text x="948" y="360" fill="#0e1d17" font-size="38">OUTPUT</text>
  </g>
  <g stroke="#00a36c" stroke-width="12" stroke-linecap="round">
    <path d="M308 348H362"/>
    <path d="M582 348H636"/>
    <path d="M856 348H910"/>
  </g>
  <text x="88" y="624" fill="#22342e" font-family="Arial, Helvetica, sans-serif" font-size="30">Signals become order.</text>
</svg>